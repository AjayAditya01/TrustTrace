<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#071426" />
    <title>Fraud alerts · TrustTrace</title>
    <link rel="icon" href="assets/brand-mark.jpg" type="image/svg+xml" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body data-page="alerts">
    <div class="app-layout">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="app-main">
        <header class="topbar" id="topbar"></header>
        <main class="content">
          <div class="demo-notice">
            <i class="bi bi-info-circle"></i
            ><span
              >Fraud detection is simulated. These demo alerts do not represent
              a real security assessment.</span
            >
          </div>
          <div class="page-heading">
            <div>
              <span class="eyebrow">THREAT REVIEW</span>
              <h1>Fraud alerts</h1>
              <p>
                Investigate unusual sign-in patterns and record a demo review
                action.
              </p>
            </div>
            <div class="heading-actions">
              <span class="role-pill"
                ><i
                  class="bi bi-circle-fill text-red"
                  style="font-size: 0.42rem"
                ></i
                >&nbsp; <span id="openAlertCount">3</span> open alerts</span
              >
            </div>
          </div>
          <section class="card section-card">
            <div class="user-toolbar">
              <div>
                <h2 class="card-title">Identity risk signals</h2>
                <p class="muted small" style="margin: 4px 0 0">
                  Prioritized examples from the mock activity stream
                </p>
              </div>
              <div class="filter-row">
                <input
                  class="field"
                  id="alertSearch"
                  type="search"
                  placeholder="Search alerts..."
                  aria-label="Search alerts"
                /><select
                  class="select"
                  id="alertSeverity"
                  aria-label="Filter by severity"
                >
                  <option value="all">All severity</option>
                  <option value="High">High</option>
                  <option value="Medium">Medium</option>
                  <option value="Low">Low</option></select
                ><select
                  class="select"
                  id="alertState"
                  aria-label="Filter by alert status"
                >
                  <option value="all">All status</option>
                  <option value="Open">Open</option>
                  <option value="Reviewed">Reviewed</option>
                </select>
              </div>
            </div>
            <div
              class="muted small"
              data-search-count
              aria-live="polite"
              style="min-height: 18px; margin-bottom: 6px"
            ></div>
            <div class="alert-card-grid" id="alertGrid"></div>
          </section>
        </main>
      </div>
    </div>
    <script src="js/data.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/dashboard.js" defer></script>
  </body>
</html>
